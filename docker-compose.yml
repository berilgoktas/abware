# Host portları: API 3001, frontend 3002
name: abware

services:
  api:
    build:
      context: ./abware_api
    env_file:
      - ./abware_api/.env
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "False"
      PREFERRED_URL_SCHEME: http
      CORS_ORIGINS: http://localhost:3002,http://127.0.0.1:3002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports:
      - "3001:5000"

  web:
    build:
      context: ./abware_front
    ports:
      - "3002:80"
    depends_on:
      - api
    restart: unless-stopped
